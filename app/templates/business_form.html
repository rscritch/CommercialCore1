{% extends "base.html" %}{% block content %}
<h1>Add business</h1><form method="post" class="card">
<div class="grid">
<div class="span-6 field"><label>Legal name</label><input name="legal_name" required></div>
<div class="span-6 field"><label>DBA name</label><input name="dba_name"></div>
<div class="span-6 field"><label>Industry</label><input name="industry"></div>
<div class="span-3 field"><label>Renewal month</label><input type="number" min="1" max="12" name="renewal_month"></div>
<div class="span-3 field"><label>Producer</label><select name="producer_id"><option value="">Unassigned</option>{% for u in users %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}</select></div>
</div><button>Create business</button></form>{% endblock %}
